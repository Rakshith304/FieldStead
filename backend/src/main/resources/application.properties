spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farm_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:local-dev-signing-key-change-before-deployment-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.demo-seed-users=${DEMO_SEED_USERS:true}
