services:
  # -----------------------------------------------------------------
  # 1. MySQL Database (Private Service)
  # Accessible internally within Render at host: farm-mysql:3306
  # Note: Render Persistent Disks require a paid instance (e.g. Starter).
  # If you prefer a free managed MySQL (e.g. Aiven, Railway, TiDB Cloud),
  # remove this service and supply DB_URL directly to farm-backend.
  # -----------------------------------------------------------------
  - type: pserv
    name: farm-mysql
    runtime: image
    image:
      url: mysql:8.0
    disk:
      name: farm-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: farm_db
      - key: MYSQL_USER
        value: farmapp
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # -----------------------------------------------------------------
  # 2. Spring Boot Backend API (Web Service)
  # Built using backend/Dockerfile
  # -----------------------------------------------------------------
  - type: web
    name: farm-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/equipment
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_URL
        value: jdbc:mysql://farm-mysql:3306/farm_db?serverTimezone=UTC
      - key: DB_USERNAME
        value: farmapp
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: farm-mysql
          envVarKey: MYSQL_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://farm-frontend.onrender.com

  # -----------------------------------------------------------------
  # 3. React Frontend (Static Site - Free CDN Hosting)
  # Single Page Application with rewrite fallback to index.html
  # -----------------------------------------------------------------
  - type: web
    name: farm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://farm-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
